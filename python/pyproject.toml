[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "extrafemi-lodestone"
version = "0.1.0"
description = "Reliable AI calls on a shoestring budget: failover across providers, a time budget, spend limits and plain-language errors. Zero dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Extrafemi" }]
keywords = ["llm", "openrouter", "failover", "circuit-breaker", "serverless"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.urls]
Homepage = "https://lodestone.extrafemi.com"
Source = "https://github.com/obasaolorunfemi-ai/lodestone"

[tool.hatch.build.targets.wheel]
packages = ["src/lodestone"]
